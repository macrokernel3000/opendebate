name: Check public data

on:
  push:
    branches: [main]
    paths:
      - "data/public-data*.csv"
      - "data/public-data.js"
      - "data/update-report.txt"
      - "data/entity-registry.csv"
      - "data/competition-registry.csv"
      - "data/event-metadata.csv"
      - "data/event-rosters.csv"
      - "data/site-content.csv"
      - "data/upcoming-events.js"
      - "data/calendar-activities.js"
      - "tools/build_data.py"
      - "tools/calendar_feed.py"
      - "tools/check_generated.py"
      - "tools/data_validation.py"
      - "tools/entity_registry.py"
      - "tools/prepare_sheet_update.py"
      - "tools/source_reader.py"
      - "tools/xlsx_reader.py"
      - "tests/**"
      - "calendar.ics"
      - "debate-records.html"
      - "sitemap.xml"
      - "app.js"
      - "index.html"
      - "styles.css"
      - "js/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "data/public-data*.csv"
      - "data/public-data.js"
      - "data/update-report.txt"
      - "data/entity-registry.csv"
      - "data/competition-registry.csv"
      - "data/event-metadata.csv"
      - "data/event-rosters.csv"
      - "data/site-content.csv"
      - "data/upcoming-events.js"
      - "data/calendar-activities.js"
      - "tools/build_data.py"
      - "tools/calendar_feed.py"
      - "tools/check_generated.py"
      - "tools/data_validation.py"
      - "tools/entity_registry.py"
      - "tools/prepare_sheet_update.py"
      - "tools/source_reader.py"
      - "tools/xlsx_reader.py"
      - "tests/**"
      - "calendar.ics"
      - "debate-records.html"
      - "sitemap.xml"
      - "app.js"
      - "index.html"
      - "styles.css"
      - "js/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        # actions/checkout v7.0.1, pinned to its official tag commit.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        # actions/setup-python v7.0.0, pinned to its official tag commit.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Set up Node.js
        # actions/setup-node v7.0.0, pinned to its official tag commit.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"

      - name: Run frontend module tests
        run: node --test tests/*.test.cjs

      - name: Run data build checks
        run: python tools/build_data.py --check --fail-on-warnings

      - name: Rebuild generated website files
        if: github.head_ref != 'automation/google-sheet-data-update'
        run: python tools/build_data.py

      - name: Check committed generated files are current
        # Google Sheet PR outputs are built and validated from a downloaded XLSX
        # in update-data-from-google-sheet.yml, not from the CSVs in this repo.
        if: github.head_ref != 'automation/google-sheet-data-update'
        run: python tools/check_generated.py --base-ref HEAD

      - name: Run builder unit tests
        run: python -m unittest discover -s tests -v
