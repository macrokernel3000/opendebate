name: Generate iOS homepage artifacts (feature branch only)

on:
  push:
    branches:
      - feature/ios-home-live-feed-20261012
    paths:
      - ".github/workflows/build-ios-home-preview.yml"
      - "tools/ios_home_feed.py"
      - "tools/build_data.py"
      - "tools/ios_public_feed.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.ref == 'refs/heads/feature/ios-home-live-feed-20261012'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Build from existing public sources
        run: python tools/build_data.py
      - name: Commit matching iOS home, catalog and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ios/v1/home.json data/ios/v1/catalog.json data/ios/v1/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "data(ios): publish generated homepage preview artifacts"
            git push
          fi
