name: Prepare Google Sheet data update

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: google-sheet-data-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Save current report for comparison
        run: cp data/update-report.txt /tmp/update-report-before.txt

      - name: Download Google Sheet as Excel
        env:
          GOOGLE_SHEET_ID: 1_qO5YLLRlQt9R7NSA3MIqWsXDsp349B919D7WX_lj2w
        run: |
          set -euo pipefail
          mkdir -p data
          curl -L --fail \
            "https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/export?format=xlsx" \
            -o data/google-sheet-export.xlsx
          python - <<'PY'
          from pathlib import Path
          path = Path("data/google-sheet-export.xlsx")
          if path.stat().st_size < 10000 or path.read_bytes()[:4] != b"PK\x03\x04":
              raise SystemExit("Google Sheet 匯出失敗：下載結果不是有效 Excel 檔。請確認試算表分享權限。")
          print(f"已下載 Google Sheet：{path.stat().st_size:,} bytes")
          PY

      - name: Validate source data before building
        env:
          PUBLIC_DATA_SOURCE: data/google-sheet-export.xlsx
        run: python tools/build_data.py --check --fail-on-warnings

      - name: Build website data
        env:
          PUBLIC_DATA_SOURCE: data/google-sheet-export.xlsx
        run: python tools/build_data.py

      - name: Prepare review summary
        id: changes
        run: |
          set -euo pipefail
          git add -- data/public-data.js data/update-report.txt data/entity-registry.csv index.html calendar.ics sitemap.xml debate-records.html
          python tools/prepare_sheet_update.py \
            --base-ref origin/main \
            --before-report /tmp/update-report-before.txt \
            --summary-file "$RUNNER_TEMP/google-sheet-update-summary.md" \
            --github-output "$GITHUB_OUTPUT" \
            --step-summary "$GITHUB_STEP_SUMMARY"

      - name: Create review branch
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c automation/google-sheet-data-update
          git commit -m "Prepare public data update from Google Sheet"
          git push --force origin automation/google-sheet-data-update

      - name: Open or update pull request
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BODY_FILE: ${{ runner.temp }}/google-sheet-update-summary.md
        run: |
          set -euo pipefail
          gh pr list --repo "$REPOSITORY" --head automation/google-sheet-data-update --json url --jq '.[0].url' > /tmp/pr-url.txt
          pr_url="$(cat /tmp/pr-url.txt)"
          if [ -n "$pr_url" ]; then
            gh pr edit "$pr_url" \
              --title "Review public data update from Google Sheet" \
              --body-file "$BODY_FILE"
            echo "已更新待審查的 PR：$pr_url" >> "$GITHUB_STEP_SUMMARY"
          else
            gh pr create \
              --repo "$REPOSITORY" \
              --base main \
              --head automation/google-sheet-data-update \
              --title "Review public data update from Google Sheet" \
              --body-file "$BODY_FILE"
          fi
