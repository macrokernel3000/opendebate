name: V1 data update retired

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: google-sheet-data-update
  cancel-in-progress: false

jobs:
  retired-notice:
    runs-on: ubuntu-24.04
    steps:
      - name: Explain the new source of truth
        run: |
          echo "V1 公開站已停止接收資料更新。" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "請在 V2 public-source/ 維護公開資料；本 repository 只保留舊 App 相容檔案與轉址入口。" | tee -a "$GITHUB_STEP_SUMMARY"
