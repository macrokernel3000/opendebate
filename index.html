<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, follow" />
  <meta name="opendebate-site-state" content="v1-retired" />
  <meta name="theme-color" content="#0f5d4a" />
  <meta http-equiv="refresh" content="10; url=https://opendebate.kerneldebate.com/site/" />
  <link rel="canonical" href="https://opendebate.kerneldebate.com/site/" />
  <link rel="icon" href="assets/site-logo.svg" />
  <title>公開辯論資訊網已移轉</title>
  <style>
    :root {
      color-scheme: light;
      font-family: ui-rounded, "SF Pro Rounded", "PingFang TC", "Noto Sans TC", sans-serif;
      color: #113d32;
      background: #f8f6ef;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 14% 12%, rgba(255, 214, 74, .24), transparent 28rem),
        radial-gradient(circle at 88% 88%, rgba(15, 93, 74, .16), transparent 30rem),
        #f8f6ef;
    }
    main {
      width: min(100%, 560px);
      padding: clamp(28px, 7vw, 52px);
      border: 1px solid rgba(15, 93, 74, .18);
      border-radius: 28px;
      background: rgba(255, 255, 255, .9);
      box-shadow: 0 22px 70px rgba(17, 61, 50, .12);
      text-align: center;
    }
    .logo {
      width: 72px;
      height: 72px;
      margin-bottom: 18px;
    }
    .eyebrow {
      margin: 0 0 8px;
      color: #8a6a18;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .18em;
    }
    h1 {
      margin: 0;
      font-size: clamp(28px, 7vw, 42px);
      line-height: 1.18;
    }
    p {
      margin: 16px auto 24px;
      color: #557068;
      font-size: 17px;
      line-height: 1.75;
    }
    a {
      display: inline-flex;
      min-height: 50px;
      align-items: center;
      justify-content: center;
      padding: 0 28px;
      border-radius: 999px;
      color: #fff;
      background: #0f7058;
      font-size: 17px;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 6px 0 #0b4f40;
    }
    a:focus-visible { outline: 4px solid rgba(241, 196, 41, .65); outline-offset: 4px; }
    small {
      display: block;
      margin-top: 24px;
      color: #71827d;
      line-height: 1.6;
    }
  </style>
  <script src="js/v1-retirement-redirect.js"></script>
</head>
<body>
  <main>
    <img class="logo" src="assets/site-logo.svg" alt="公開辯論資訊網" />
    <p class="eyebrow">OPENDEBATE</p>
    <h1>網站已移轉</h1>
    <p>公開資料與會員功能已整合至新版網站，正在為你前往新站。</p>
    <a data-v2-link href="https://opendebate.kerneldebate.com/site/">前往新版網站</a>
    <small>舊版公開資料下載、隱私政策與支援頁暫時保留。</small>
  </main>
</body>
</html>
