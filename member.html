<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>會員入口｜公開辯論資訊網</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="member-entry-page">
  <main class="member-entry-shell">
    <a class="member-entry-brand" href="./"><img src="assets/site-logo.svg" alt=""><span>公開辯論資訊網</span></a>
    <section class="member-entry-card" aria-labelledby="memberEntryTitle">
      <p class="kicker">會員功能</p>
      <h1 id="memberEntryTitle">會員紀錄只有本人能查看</h1>
      <p id="memberPortalStatus" aria-live="polite">正在確認會員服務狀態。</p>
      <ul>
        <li>每位會員使用「暱稱#隨機編號」識別，也能設定常用姓名。</li>
        <li>私人分數與建檔內容不會出現在管理後台。</li>
        <li>建檔仍使用網站原本的選手與隊伍表格。</li>
        <li>可補登現有戰績、新增賽事，或送出其他建議。</li>
        <li>所有回報先進待審區，不會直接改寫公開資料。</li>
      </ul>
      <a id="memberPortalLink" class="report-link is-disabled" aria-disabled="true">會員入口尚未開放</a>
      <p class="member-entry-note">網站只保存提供功能所需的最小資料；公開成績與私人紀錄分開處理。</p>
    </section>
  </main>
  <script src="js/member-config.js"></script>
  <script src="js/member-portal.js"></script>
</body>
</html>
